<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Corda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* One phone-width column: the question, the wall of strings, then one field at a time. */
:root{
  color-scheme:light;
  --bg:#f3f2ee; --panel:#ffffff; --panel2:#f7f5f0; --line:#ddd8cd;
  --ink:#1f1d1a; --dim:#6b665c; --accent:#8a5c0e; --accent-soft:#fbf1dc; --ok:#2f7d3a; --bad:#b4432f;
  --edge:#00000026; --brick:#ddd6c7; --brick-line:#c2b9a6; --wall-edge:#a89f8c;
  --log-bg:#efe4c6; --log-ink:#2b2214; --cord-r:#9a8463; --bell:#b89a68; --bell-edge:#7d6643; --bell-ring:#e09a1a; --pulse:#e09a1a;
  --display:"Grenze Gotisch", Georgia, serif;
  --body:"Alegreya", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#1a1814; --panel:#24211c; --panel2:#2c2823; --line:#3b362e;
  --ink:#f0ebe0; --dim:#aaa293; --accent:#e0a63a; --accent-soft:#3a2f17; --ok:#6fc07a; --bad:#e8826c;
  --edge:#ffffff40; --brick:#38332b; --brick-line:#4a443a; --wall-edge:#5c5446;
  --log-bg:#3a3322; --log-ink:#efe4c6; --cord-r:#8c7a5c; --bell:#a58a5b; --bell-edge:#6f5a38; --bell-ring:#e0a63a; --pulse:#f0b84a}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.45;margin:0;padding-block:16px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:14px}
h1,h2{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:2rem;color:var(--accent);line-height:1}
h2{font-size:1.6rem;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top span{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.q{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:14px 16px;display:grid;gap:4px}
.q small{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.q b{font-family:var(--display);font-weight:500;font-size:1.75rem;line-height:1.1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 16px;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.btn.big{width:100%;font-size:1.1rem;min-height:52px}
.btn.quiet{border-color:transparent;background:none;color:var(--dim);text-decoration:underline;padding:6px 8px;min-height:36px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);border:1px solid var(--edge);vertical-align:-.05em}

.app{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;scroll-margin-top:8px}
.app svg{display:block;width:100%;height:auto}
.legend{display:flex;justify-content:space-between;gap:8px;padding:6px 12px 10px;font-size:.82rem;color:var(--dim)}
.say{padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);min-height:3.2em}
.cord{stroke-width:3.5;stroke-linecap:round}
.cord-u{stroke:var(--edge);stroke-width:7;stroke-linecap:round}
.cord-r{stroke:var(--cord-r);stroke-width:3}
.cross{fill:none;stroke-width:3.5}
.pulse{fill:none;stroke:var(--pulse);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 120;stroke-dashoffset:10;opacity:0}
.pulse.go{animation:run .55s linear}
@keyframes run{0%{stroke-dashoffset:10;opacity:1}96%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
.masonry{transition:opacity .5s}
.handle{cursor:pointer}
.handle .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.handle.hint .halo{opacity:1;animation:glow 1.1s ease-in-out infinite alternate}
.handle.grab .halo{opacity:1;stroke:var(--ink);animation:none}
@keyframes glow{from{stroke-width:2}to{stroke-width:5}}
.tug.pulled{animation:tug .5s ease-out}
@keyframes tug{30%{transform:translateY(16px)}}
.bell{transform-box:fill-box;transform-origin:50% 0}
.bell path{fill:var(--bell);stroke:var(--bell-edge)}
.bell.ring{animation:swing .9s ease-out}
.bell.ring path{fill:var(--bell-ring)}
@keyframes swing{15%{transform:rotate(18deg)}35%{transform:rotate(-14deg)}55%{transform:rotate(9deg)}75%{transform:rotate(-4deg)}}

.prog{display:flex;gap:6px;align-items:center}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.f{background:var(--accent)}
.prog i.c{background:var(--accent-soft);outline:1px solid var(--accent)}
.progt{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.stage{display:grid;gap:12px;scroll-margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;display:grid;gap:4px;min-height:76px;align-content:start}
.card:hover:not(:disabled){border-color:var(--accent)}
.card.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:9px}
.card .ic{width:26px;height:26px;color:var(--accent)}
.card .nm{line-height:1.15}
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom, 0px));background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:10px;display:grid;gap:8px;box-shadow:0 2px 10px #00000030}
.bar .sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.line{background:var(--log-bg);color:var(--log-ink);border-radius:3px;padding:10px 12px;font-family:var(--mono);font-size:.86rem;word-spacing:.4em;overflow-wrap:anywhere}
.net{padding:10px 14px;border:1px solid var(--line);border-radius:4px}
.net.ok{border-color:var(--ok);color:var(--ok)}
.net.fail{border-color:var(--bad);color:var(--bad)}
.fr{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.fr .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.fr b{font-size:1.15rem}
.fr .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.92rem;color:var(--dim)}
.bells span{display:inline-block;width:1.7em;text-align:center;font-family:var(--display);color:var(--dim);opacity:.55}
.bells span.on{opacity:1;background:var(--log-bg);color:var(--log-ink);border-radius:3px}
details{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
summary{cursor:pointer;font-family:var(--mono);font-size:.82rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>La Corda</h1><span>Milan, 1478</span></div>

  <div class="q"><small>The Duke asks</small><b id="question"></b></div>

  <div class="panel" style="display:grid;gap:8px">
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="progt" id="progt"></div>
  </div>

  <div class="app" id="appwrap">
    <svg id="app" viewBox="0 0 340 300" aria-label="Five strings pass through a wall and ring five bells for the messenger"></svg>
    <div class="legend"><span>You pull</span><span>The wall crosses them</span><span>He hears</span></div>
  </div>
  <div class="say" id="say" aria-live="polite"></div>
  <div><button class="btn" id="eyes" aria-pressed="false">Show the crossing inside the wall</button></div>

  <div class="stage" id="stage"></div>
</div>

<script src="vox.js"></script>
<script>
(()=>{
const {STR,ROMAN,ALL,P,on,enc,dec,names,dots,bellsOf,FIELDS,STATUS,SUBCODES,SUBJECTS,GRAVITY,FEELING,meaning,ic}=VOX;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#question').textContent=VOX.QUESTION;

let phase='intro',sent=[],hint=null,busy=false,grabbed=[],result=null,net='idle';

/* apparatus: strings run top to bottom so it fits a phone */
const X=i=>40+i*65;
function build(){
  let h=`<defs><pattern id="brick" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="var(--brick)"/><path d="M0 .5H40M0 11.5H40M.5 0V11M20.5 11V22" stroke="var(--brick-line)" stroke-width="1.2"/></pattern></defs>`;
  for(let i=0;i<5;i++)h+=`<path class="cross" d="M${X(i)} 96 C${X(i)} 130 ${X(P[i])} 146 ${X(P[i])} 180" stroke="${STR[i].c}"/>`;
  for(let j=0;j<5;j++)h+=`<line class="cord-r" x1="${X(j)}" y1="180" x2="${X(j)}" y2="236"/><g transform="translate(${X(j)},232)"><g class="bell" id="b${j}"><path d="M-13 26C-13 10 -9 4 0 4S13 10 13 26L16 29H-16Z"/></g></g><text x="${X(j)}" y="288" text-anchor="middle" style="font-family:'Grenze Gotisch',serif;font-size:18px" fill="var(--ink)">${ROMAN[j]}</text>`;
  for(let i=0;i<5;i++)h+=`<path class="pulse" id="p${i}" pathLength="100" d="M${X(i)} 32 V96 C${X(i)} 130 ${X(P[i])} 146 ${X(P[i])} 180 V236"/>`;
  h+=`<rect class="masonry" id="wall" x="14" y="96" width="312" height="84" fill="url(#brick)" stroke="var(--wall-edge)"/>`;
  for(let i=0;i<5;i++)h+=`<g class="tug" id="t${i}"><line class="cord-u" x1="${X(i)}" y1="32" x2="${X(i)}" y2="96"/><line class="cord" x1="${X(i)}" y1="32" x2="${X(i)}" y2="96" stroke="${STR[i].c}"/>
    <g class="handle" id="h${i}" data-i="${i}" tabindex="0" role="button" aria-label="Grab the ${STR[i].n} string"><circle class="halo" cx="${X(i)}" cy="32" r="22"/><circle cx="${X(i)}" cy="32" r="15" fill="${STR[i].c}" stroke="var(--edge)" stroke-width="1.5"/><text x="${X(i)}" y="37" text-anchor="middle" style="font-size:13px;font-weight:700" fill="${STR[i].t}">${STR[i].l}</text></g></g>`;
  $('#app').innerHTML=h;
  $$('#app .handle').forEach(g=>{const f=()=>grab(+g.dataset.i);g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
}
const restart=(el,c)=>{el.classList.remove(c);void el.getBoundingClientRect();el.classList.add(c)};
function paintHandles(){const hi=hint&&hint!==ALL?on(hint):[];for(let i=0;i<5;i++){const g=$('#h'+i);g.classList.toggle('grab',grabbed.includes(i));g.classList.toggle('hint',!grabbed.includes(i)&&hi.includes(i))}}
const say=t=>{$('#say').innerHTML=t};
const look=(sel,block)=>{try{$(sel).scrollIntoView({behavior:calm?'auto':'smooth',block})}catch(e){}};

function grab(i){
  if(busy||phase!=='compose'||sent.length>=5){say('Use the button to pull all five strings.');return}
  if(!hint){say('Pick a picture first. Then pull its two strings.');return}
  if(!on(hint).includes(i)){say('That string is not part of this picture. Tap a glowing handle.');return}
  grabbed.includes(i)?grabbed=grabbed.filter(x=>x!==i):grabbed.push(i);paintHandles();
  if(grabbed.length===2)pull(hint);
}

async function deliver(){
  net='sending';render();
  try{await VOX.send(result.map(enc));net='ok'}catch(e){net='fail'}
  render();
}

async function pull(code){
  if(busy)return;busy=true;hint=null;grabbed=[];paintHandles();render();
  look('#appwrap','nearest');await wait(calm?0:250);
  const use=code===ALL?[0,1,2,3,4]:on(code);
  use.forEach(i=>{restart($('#t'+i),'pulled');restart($('#p'+i),'go')});
  await wait(calm?0:520);
  use.forEach(i=>restart($('#b'+P[i]),'ring'));
  await wait(calm?0:350);
  let send=false;
  if(code===ALL){
    if(phase==='intro'){phase='compose';sent=[];say('<b>Line open.</b> All five bells rang. The messenger starts a new line in his log.')}
    else if(sent.length===5){result=sent.slice();phase='done';send=true;say('<b>Sent.</b> The messenger wrote down bell numbers only. Watch the screen: the Duke’s office reads the log.')}
    else{phase='intro';sent=[];say('<b>Cancelled.</b> The office will discard the unfinished line.')}
  }else{
    sent.push(code);
    say(`You pulled <b>${names(code)}</b>. The messenger heard bells <b>${bellsOf(code)}</b>, not the strings.`);
  }
  busy=false;render();look('#stage','start');
  if(send)deliver();
}

/* the stage: one screen at a time */
function options(){
  const f=sent.length;
  if(f===0)return{title:'Who are you in this room?',opts:STATUS};
  if(f===1)return{title:'What is your opinion about?',opts:SUBJECTS};
  if(f===2){const su=SUBJECTS.find(s=>s.code===sent[1])||SUBJECTS[0];return{title:su.label+': which part?',opts:SUBCODES.map((c,i)=>({code:c,label:su.subs[i]}))}}
  if(f===3)return{title:'How much does it matter to you?',opts:GRAVITY};
  return{title:'How does it make you feel?',opts:FEELING};
}
function resultHTML(){
  const codes=result||[],m=meaning(codes);
  const rows=FIELDS.map((f,k)=>{const c=codes[k];if(!c)return '';const r=enc(c);
    return `<div class="fr"><span class="k">${f}</span><b>${m[k]||'not on the board'}</b><div class="row"><span class="bells">${[...r].map((b,j)=>`<span class="${b==='1'?'on':''}">${ROMAN[j]}</span>`).join('')}</span><span>${dots(dec(r))} ${names(dec(r))}</span></div></div>`}).join('');
  const netHTML=net==='sending'?`<div class="net">Carrying your message to the messenger…</div>`
    :net==='ok'?`<div class="net ok"><b>Delivered.</b> Your message is in the messenger’s log.</div>`
    :net==='fail'?`<div class="net fail"><b>The message did not arrive.</b> Check your connection and try again.</div><button class="btn primary big" data-act="retry">Try again</button>`:'';
  return `<h2>Your message is on its way</h2>
    <p class="sub">The messenger writes only bell numbers. Without the crossing they mean nothing to him, or to the authority between you and the Duke.</p>
    <div class="line">${codes.map(c=>bellsOf(c)).join('  ·  ')}</div>
    ${netHTML}
    <details><summary>What the Duke’s office will read</summary><div>${rows}</div></details>
    <button class="btn big" data-act="again" ${net==='sending'?'disabled':''}>Send another opinion</button>`;
}
function render(){
  $('#prog').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<sent.length||phase==='done'?'f':''}${phase==='compose'&&i===sent.length?' c':''}"></i>`).join('');
  $('#progt').textContent=phase==='intro'?'Not started':phase==='done'?'Message sent':sent.length<5?`Field ${sent.length+1} of 5`:'All five fields chosen';
  let h='';
  if(phase==='intro')h=`<h2>Send your opinion</h2><p>Answer the Duke’s question in five small choices. You pull two strings for each one, the way a citizen would. The messenger next door hears only bells.</p><button class="btn primary big" data-act="pullall" ${busy?'disabled':''}>Pull all five strings to start</button>`;
  else if(phase==='compose'&&sent.length===5)h=`<h2>Ready to send</h2><p>All five fields are in. Pull all five strings to end the message.</p><button class="btn primary big" data-act="pullall" ${busy?'disabled':''}>Pull all five strings to send</button>`;
  else if(phase==='compose'){
    const o=options();
    h=`<h2>${o.title}</h2><div class="cards">${o.opts.map(x=>`<button class="card${hint===x.code?' sel':''}" data-act="card" data-code="${x.code}" aria-pressed="${hint===x.code}" ${busy?'disabled':''}>${x.icon?ic(x.icon):''}<span class="nm">${x.label}</span><span>${dots(x.code)}</span></button>`).join('')}</div>
    <div class="bar">${hint?`<div class="sel">${dots(hint)}<span>Pull <b>${names(hint)}</b></span></div><button class="btn primary big" data-act="pullsel" ${busy?'disabled':''}>Pull both strings</button><span class="sub" style="font-size:.85rem">Or tap the two glowing handles above.</span>`:`<span class="sub">Choose a picture. Then you pull its two strings.</span>`}
    <button class="btn quiet" data-act="cancel" ${busy?'disabled':''}>Cancel this message (pull all five)</button></div>`;
  }else h=resultHTML();
  $('#stage').innerHTML=h;
}
$('#stage').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||busy)return;const a=b.dataset.act;
  if(a==='card'){const c=b.dataset.code;hint=hint===c?null:c;grabbed=[];paintHandles();render();say(hint?`Pull the glowing strings: <b>${names(hint)}</b>. Tap both handles, or use the button.`:'Pick a picture, then pull its two strings.')}
  else if(a==='pullsel'&&hint)pull(hint);
  else if(a==='pullall'||a==='cancel')pull(ALL);
  else if(a==='retry')deliver();
  else if(a==='again'){phase='intro';sent=[];result=null;hint=null;net='idle';render();say('Pull all five strings to open a new line.');look('#appwrap','nearest')}
});
$('#eyes').addEventListener('click',e=>{const v=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',v);$('#wall').style.opacity=v?.08:1;e.currentTarget.textContent=v?'Hide the crossing':'Show the crossing inside the wall'});

build();render();paintHandles();
say('Pull all five strings to open a line to the messenger.');
})();
</script>
</body>
</html>
